name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Code Scan
        run: |
          python3 -m pip install semgrep
          semgrep --config=auto --error client/src server/src

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Frontend Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/restaurant-frontend:latest -f docker/client/Dockerfile .

      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/restaurant-frontend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/restaurant-frontend:latest

  deploy-local-cluster:
    needs: security-and-build
    runs-on: self-hosted
    steps:
      - name: Rolling Update on Local Kubernetes Cluster
        run: |
          kubectl rollout restart deployment frontend-deployment -n default
          kubectl rollout status deployment frontend-deployment -n default
