name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Run Semgrep SAST Scan using official container directly
      - name: Run Semgrep SAST Scan
        run: |
          docker run --rm -v $(pwd):/src semgrep/semgrep semgrep scan --config=auto /src

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build Frontend
      - name: Build Frontend Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/restaurant-frontend:latest -t ${{ secrets.DOCKERHUB_USERNAME }}/restaurant-frontend:${{ github.sha }} -f docker/client/Dockerfile .

      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/restaurant-frontend:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Build Backend
      - name: Build Backend Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/restaurant-backend:latest -t ${{ secrets.DOCKERHUB_USERNAME }}/restaurant-backend:${{ github.sha }} -f docker/server/Dockerfile .

      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/restaurant-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Push Images
      - name: Push Images to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/restaurant-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/restaurant-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/restaurant-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/restaurant-backend:${{ github.sha }}

  deploy-local-cluster:
    needs: security-and-build
    runs-on: self-hosted
    steps:
      - name: Checkout Code on Self-Hosted Runner
        uses: actions/checkout@v4

      - name: Rolling Update on Local Kubernetes Cluster
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/frontend-deployment frontend=${{ secrets.DOCKERHUB_USERNAME }}/restaurant-frontend:${{ github.sha }} -n default || true
          kubectl set image deployment/backend-deployment backend=${{ secrets.DOCKERHUB_USERNAME }}/restaurant-backend:${{ github.sha }} -n default || true
          kubectl rollout restart deployment/frontend-deployment deployment/backend-deployment -n default
          kubectl rollout status deployment/frontend-deployment -n default
          kubectl rollout status deployment/backend-deployment -n default
